# Dev-style compose: separate services. The single production image
# (nginx + supervisor + gunicorn) is a deferred follow-up.
#
# The app runs in containers but connects OUT to the host-OS PostgreSQL
# (database "solar_hub") via host.docker.internal — see backend/.env.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    # Per-process log file so RotatingFileHandler doesn't rotate a file another
    # process is writing (all services bind-mount ./backend → share ./backend/logs).
    environment:
      - LOG_FILE_NAME=web.log
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Hai worker, mỗi worker một queue (CELERY_TASK_ROUTES trong settings.py):
  # task sync do người dùng bấm (interactive) không bao giờ xếp sau job nền (periodic).
  celery_worker_interactive:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - LOG_FILE_NAME=celery-interactive.log
    command: celery -A config worker -l info -Q interactive --concurrency=2
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery_worker_periodic:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - LOG_FILE_NAME=celery-periodic.log
    command: celery -A config worker -l info -Q periodic --concurrency=2
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery_beat:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - LOG_FILE_NAME=celery-beat.log
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
